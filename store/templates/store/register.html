{% extends "store/base.html" %}
{% block title %}Sign Up — Deskyard{% endblock %}
{% block content %}
<div class="auth-card" style="background:var(--panel); border:1px solid rgba(255,255,255,0.08); border-radius:var(--radius);">
  <p class="eyebrow">Create account</p>
  <h1 style="font-size:28px; margin-bottom:6px;">Sign Up</h1>
  <p style="color:var(--ink-muted); font-size:14px; margin:0 0 24px;">Create a free account to track your orders.</p>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" id="register-btn" style="width:100%; margin-top:8px;">Create Account</button>
  </form>
  <p style="margin-top:20px; font-size:14px; color:var(--ink-muted); text-align:center;">
    Already have an account? <a href="{% url 'login' %}" style="color:var(--blueprint);">Log in</a>
  </p>
</div>
{% endblock %}
