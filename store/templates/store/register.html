{% extends "store/base.html" %}
{% block title %}Sign Up — Deskyard{% endblock %}
{% block content %}
<div class="auth-card">
  <p class="eyebrow">Create account</p>
  <h1 class="auth-title">Sign Up</h1>
  <p class="auth-sub">Create a free account to track your orders.</p>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" id="register-btn" class="btn-block">Create Account</button>
  </form>
  <p class="auth-switch">Already have an account? <a href="{% url 'login' %}">Log in</a></p>
</div>
{% endblock %}
