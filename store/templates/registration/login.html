{% extends "store/base.html" %}
{% block title %}Log In — Deskyard{% endblock %}
{% block content %}
<div class="auth-card">
  <p class="eyebrow">Welcome back</p>
  <h1 class="auth-title">Log In</h1>
  <p class="auth-sub">Sign in to view your orders and chat with support.</p>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" id="login-btn" class="btn-block">Log In</button>
  </form>
  <p class="auth-switch">No account? <a href="{% url 'register' %}">Sign up for free</a></p>
</div>
{% endblock %}
