<div id="chat-widget">
  <button id="chat-toggle" aria-label="Open support chat" aria-expanded="false">Support</button>
  <div id="chat-panel" class="chat-card hidden" role="dialog" aria-label="Customer support chat">
    <div class="chat-header">
      <button id="chat-close" aria-label="Close chat">&times;</button>
    </div>
    <div id="messages" class="chat-messages" aria-live="polite"></div>
    <form id="chat-form" class="chat-input-row">
      <input id="chat-input" type="text" placeholder="Ask a question…" autocomplete="off" aria-label="Chat message" />
      <button type="submit">Send</button>
    </form>
  </div>
</div>
