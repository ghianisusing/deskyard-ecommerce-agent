name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check --output-format=github .
      - name: Formatting
        run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    env:
      # Tests mock OpenAI, so no real key is needed. DJANGO_DEBUG is left
      # unset so tests run against the production settings, which require
      # a secret key.
      DJANGO_SECRET_KEY: ci-only-not-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Django system check
        run: python manage.py check
      - name: Deployment check
        # Runs with a fully configured production setup and fails on any
        # warning, so removing a security setting or middleware breaks CI.
        # The values here exist only for this step.
        run: |
          DJANGO_SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(50))')" \
          DJANGO_ALLOWED_HOSTS=shop.example.com \
          DJANGO_SECURE_SSL_REDIRECT=True \
          DJANGO_SECURE_HSTS_SECONDS=31536000 \
          DJANGO_SECURE_HSTS_PRELOAD=True \
          python manage.py check --deploy --fail-level WARNING
      - name: Missing migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Tests
        run: python manage.py test --verbosity 2
